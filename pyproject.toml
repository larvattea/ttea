[project]
name = "t-tea"
version = "2.0.0"
description = "Console para exergames de chão interativo"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe==0.10.21",
    "numpy==1.26.4",
    "opencv-contrib-python==4.11.0.86",
    "platformdirs==4.10.1",
    "portalocker==3.2.0",
    "psutil==7.2.2",
    "pygame==2.6.1",
    "pyside6==6.11.1",
]

[project.scripts]
dev = "ttea.main:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

# ======================================================================
# Estilo (PEP 8)
# ======================================================================
# Padrão do time: black com linhas de 79 caracteres (limite da PEP 8).
[tool.black]
line-length = 79
target-version = ["py310"]
extend-exclude = '''
(
    /ui/                # gerado pelo pyside6-uic a partir dos .ui
  | _rc\.py$            # gerado pelo pyside6-rcc a partir dos .qrc
)
'''

[tool.ruff]
line-length = 79
# Mesmo piso de requires-python: permite dict/list e X | None.
target-version = "py310"
# ``_`` é instalado em builtins pelo gettext.install() no jogo.
builtins = ["_"]
extend-exclude = [
    "src/ttea/ui",
    "src/ttea/games/kartea/ui",
    "*_rc.py",
]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle (erros)
    "W",       # pycodestyle (avisos)
    "F",       # pyflakes
    "I",       # ordem e agrupamento dos imports (isort)
    "N",       # pep8-naming
    "UP",      # pyupgrade (dict/list, X | None)
    "C90",     # complexidade (mccabe)
    "PLR0912", # muitos ramos
    "PLR0915", # muitos comandos
    "PLC0415", # import fora do topo do módulo
    "ERA",     # código comentado
    "S110",    # try/except/pass
    "D",       # docstrings (pydocstyle)
]

[tool.ruff.lint.pydocstyle]
# Docstrings no estilo NumPy (numpydoc). A convenção desliga as regras
# incompatíveis, como D107 (__init__ sem docstring): os parâmetros do
# construtor ficam na docstring da classe.
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["ttea"]

[tool.ruff.lint.pycodestyle]
# PEP 8: comentários e docstrings com no máximo 72 caracteres por linha.
max-doc-length = 72

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
# Métodos sobrescritos do Qt e a macro de tradução reconhecida pelo
# pyside6-lupdate mantêm o nome original.
extend-ignore-names = [
    "closeEvent",
    "eventFilter",
    "keyPressEvent",
    "resizeEvent",
    "showEvent",
    "setupUi",
    "retranslateUi",
    "QT_TRANSLATE_NOOP",
]
