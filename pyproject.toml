[project]
name = "t-tea"
version = "2.0.0"
description = "Console para exergames de chão interativo"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "mediapipe==0.10.21",
    "numpy==1.26.4",
    "opencv-contrib-python==4.11.0.86",
    "platformdirs==4.10.1",
    "portalocker==3.2.0",
    "psutil==7.2.2",
    "pygame==2.6.1",
    "pyside6==6.11.1",
]

[project.scripts]
dev = "ttea.main:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
