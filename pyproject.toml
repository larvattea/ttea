[project]
name = "t-tea"
version = "1.4.1"
description = "Console para exergames de chão interativo"
readme = "README.md"
# As versões fixadas abaixo (numpy 1.21, pandas 1.3, pygame 2.1...) só têm
# wheels até o Python 3.10.
requires-python = "==3.10.*"
dependencies = [
    "absl-py==1.0.0",
    "attrs==21.2.0",
    "cycler==0.11.0",
    "fonttools==4.28.3",
    "kiwisolver==1.3.2",
    "matplotlib==3.5.1",
    "mediapipe==0.10.5",
    "numpy==1.21.4",
    # Tem que ser a build "contrib": o cv2.aruco (calibração automática) não
    # existe no opencv-python puro.
    "opencv-contrib-python==4.5.4.60",
    "pandas==1.3.5",
    "Pillow==8.4.0",
    "protobuf==3.20",
    "pygame==2.1.0",
    "pyparsing==3.0.6",
    "python-dateutil==2.8.2",
    "pytz==2021.3",
    "screeninfo==0.8.1",
    "six==1.16.0",
]

[dependency-groups]
build = ["pyinstaller==6.16.0"]

[tool.uv]
# Os jogos não são um pacote Python: rodam como scripts a partir de Source/.
package = false
# Só Windows (captura via DirectShow, DPI awareness via ctypes).
environments = ["sys_platform == 'win32'"]
