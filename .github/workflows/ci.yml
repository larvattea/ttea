name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_VIDEODRIVER: dummy
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libpulse0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install project
        run: uv sync --locked

      - name: Run smoke test
        run: uv run --locked python -m unittest discover -s tests -p "test_smoke.py"
