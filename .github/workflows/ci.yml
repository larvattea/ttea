name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_VIDEODRIVER: dummy
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libpulse0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install project
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked tests

  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Stock Windows 10/11 installs keep the 260-character path limit
      - name: Disable long paths
        shell: pwsh
        run: >-
          Set-ItemProperty
          -Path HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem
          -Name LongPathsEnabled -Value 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install project
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked tests

      # Downloads TSDK into the packaged build's data folder and runs a
      # .ttea game through the launch screen controller
      - name: Run .ttea games on the TSDK runtime
        shell: pwsh
        run: uv run --locked python tests/smoke_tsdk_runtime.py "$env:LOCALAPPDATA\udesc\ttea"
